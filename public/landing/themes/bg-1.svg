<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
    <defs>
        <linearGradient id="bg1-sky" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3b82f6"/>
            <stop offset="50%" stop-color="#1e40af"/>
            <stop offset="100%" stop-color="#1e3a8a"/>
        </linearGradient>
        <radialGradient id="bg1-glow" cx="20%" cy="30%" r="60%">
            <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.55"/>
            <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="bg1-glow2" cx="85%" cy="80%" r="50%">
            <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.45"/>
            <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0"/>
        </radialGradient>
        <pattern id="bg1-grid" width="80" height="80" patternUnits="userSpaceOnUse">
            <path d="M 80 0 L 0 0 0 80" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
        </pattern>
    </defs>

    <rect width="1600" height="900" fill="url(#bg1-sky)"/>
    <rect width="1600" height="900" fill="url(#bg1-grid)"/>
    <rect width="1600" height="900" fill="url(#bg1-glow)"/>
    <rect width="1600" height="900" fill="url(#bg1-glow2)"/>

    <g opacity="0.18">
        <circle cx="280" cy="220" r="120" fill="#ffffff"/>
        <circle cx="380" cy="180" r="60" fill="#ffffff"/>
        <circle cx="1320" cy="640" r="160" fill="#ffffff"/>
        <circle cx="1200" cy="700" r="80" fill="#ffffff"/>
    </g>

    <g opacity="0.35" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.5">
        <path d="M 0 720 Q 400 600 800 700 T 1600 660"/>
        <path d="M 0 780 Q 400 680 800 760 T 1600 720"/>
    </g>
</svg>
